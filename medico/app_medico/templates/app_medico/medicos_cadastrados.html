{% extends 'app_medico/background.html' %}

{% block title %}Médicos cadastrados{% endblock title %}

{% block content %}
    <ul class="medicos-lista">
        {% for contact in contacts %}
            <li>
                <div>
                    <h2 class="name">{{ contact.nome }}</h2>
                    <a href="{% url 'app_medico:editar_medico' contact.pk %}" class="btn-opcao">Editar</a>
                    <a href="{% url 'app_medico:deletar_medico' contact.pk %}" class="btn-opcao">Deletar</a>
                    <!-- <p class="especialidade">{{ contact.especialidade_id }}</p> -->
                </div>
            </li>
        {% endfor %}
    </ul>

{% endblock content %}
